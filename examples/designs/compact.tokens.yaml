# A denser layout for a long CV that should stay on two pages. DTCG tokens in YAML.
$description: Compact spacing, smaller type, teal accent.
color:
  $type: color
  accent: { $value: "#0f6e6e" }   # 6.3:1 on white
font-size:
  $type: dimension
  base: { $value: 9.5pt }
  small: { $value: 8.5pt }
  name: { $value: 18pt }
  section: { $value: 10.5pt }
  entry: { $value: 9.5pt }
line-height:
  base: { $type: number, $value: 1.3 }
space:
  $type: dimension
  section: { $value: 9pt }
  entry: { $value: 5pt }
page:
  margin: { $type: dimension, $value: 0.45in }
