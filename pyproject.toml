[project]
name = "cv-gen"
version = "0.1.0"
description = "Generate CVs in Word, Markdown, text, JSON, HTML and PDF from any source, through pluggable adapters and DTCG design tokens."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Corey Struzan" }]
requires-python = ">=3.11"
keywords = ["cv", "resume", "json-resume", "docx", "pdf", "design-tokens"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "python-docx>=1.1",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
playwright = ["playwright>=1.45"]
weasyprint = ["weasyprint>=62"]

[project.scripts]
cv-gen = "cv_gen.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pypdf>=5",
    "jsonschema>=4",
    "ruff>=0.8",
    "cv-gen-example-adapter",
]

[tool.uv.sources]
cv-gen-example-adapter = { path = "examples/adapter-example", editable = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_gen"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples/adapter-example/tests"]
addopts = "-ra --strict-markers"
markers = ["browser: needs an installed Chromium-family browser"]

[tool.coverage.run]
source = ["cv_gen"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF043"]
